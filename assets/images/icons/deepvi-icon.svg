  <rect x="50" y="50" width="4" height="4" fill="currentColor" stroke="none"/>
  <rect x="56" y="50" width="4" height="4" fill="currentColor" stroke="none"/>
  <rect x="44" y="56" width="4" height="4" fill="currentColor" stroke="none"/>
  <rect x="50" y="56" width="4" height="4" fill="currentColor" stroke="none" opacity="0.4"/>
