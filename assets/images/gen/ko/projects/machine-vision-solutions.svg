<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="solArr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">VCANUS와 함께하는 Gidel 솔루션 통합</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#475569">Gidel 하드웨어 + VCANUS 플랫폼 (TSLoom · DeepVi) — End-to-End 산업 비전 솔루션</text>

  <!-- Scenario 1: Distributed Processing -->
  <rect x="40" y="90" width="1020" height="145" rx="12" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
  <circle cx="65" cy="115" r="14" fill="#1e40af"/>
  <text x="65" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">①</text>
  <text x="90" y="120" font-size="14" font-weight="700" fill="#1e3a8a">고속 · 대용량 이미지 분산 처리</text>

  <!-- Pipeline boxes -->
  <rect x="55" y="140" width="155" height="50" rx="8" fill="#1e40af"/>
  <text x="132" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">고속 카메라</text>
  <text x="132" y="178" text-anchor="middle" font-size="10" fill="#bfdbfe">대용량 데이터 취득</text>

  <line x1="215" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="245" y="140" width="180" height="50" rx="8" fill="#0d9488"/>
  <text x="335" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Gidel FantoVision</text>
  <text x="335" y="178" text-anchor="middle" font-size="10" fill="#ccfbf1">고속 수신·버퍼링</text>

  <line x1="430" y1="165" x2="455" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="460" y="140" width="180" height="50" rx="8" fill="#7c3aed"/>
  <text x="550" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">VCANUS Flowbroker</text>
  <text x="550" y="178" text-anchor="middle" font-size="10" fill="#e9d5ff">지능형 작업 분배</text>

  <line x1="645" y1="165" x2="670" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="675" y="140" width="180" height="50" rx="8" fill="#16a34a"/>
  <text x="765" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">처리 노드 1~N</text>
  <text x="765" y="178" text-anchor="middle" font-size="10" fill="#bbf7d0">수평 확장</text>

  <line x1="860" y1="165" x2="885" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="890" y="140" width="155" height="50" rx="8" fill="#0f172a"/>
  <text x="967" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">통합 분석 결과</text>
  <text x="967" y="178" text-anchor="middle" font-size="10" fill="#94a3b8">중앙 집계</text>

  <!-- Benefits -->
  <text x="55" y="212" font-size="11" fill="#1e3a8a">✓ 데이터 손실 없는 고속 수신</text>
  <text x="320" y="212" font-size="11" fill="#1e3a8a">✓ 자동 부하 분산 처리</text>
  <text x="595" y="212" font-size="11" fill="#1e3a8a">✓ 처리 노드 추가만으로 선형 확장</text>
  <text x="55" y="228" font-size="10" fill="#475569" font-style="italic">※ 촬영 속도 &gt; 처리 속도 상황에서도 안전하게 운영</text>

  <!-- Scenario 2: Stage-synchronized -->
  <rect x="40" y="245" width="1020" height="145" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="65" cy="270" r="14" fill="#d97706"/>
  <text x="65" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">②</text>
  <text x="90" y="275" font-size="14" font-weight="700" fill="#92400e">스테이지 연동 정밀 촬영 및 이미지 병합</text>

  <rect x="55" y="295" width="160" height="50" rx="8" fill="#92400e"/>
  <text x="135" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">엔코더</text>
  <text x="135" y="333" text-anchor="middle" font-size="10" fill="#fef3c7">위치 신호 (RS422)</text>

  <line x1="220" y1="320" x2="245" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="250" y="295" width="180" height="50" rx="8" fill="#1e40af"/>
  <text x="340" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">FPGA HawkEye</text>
  <text x="340" y="333" text-anchor="middle" font-size="10" fill="#bfdbfe">위치 분석 · 트리거</text>

  <line x1="435" y1="320" x2="460" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="465" y="295" width="170" height="50" rx="8" fill="#dc2626"/>
  <text x="550" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">카메라 + 조명</text>
  <text x="550" y="333" text-anchor="middle" font-size="10" fill="#fecaca">동시 트리거</text>

  <line x1="640" y1="320" x2="665" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="670" y="295" width="170" height="50" rx="8" fill="#7c3aed"/>
  <text x="755" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DMA 버퍼</text>
  <text x="755" y="333" text-anchor="middle" font-size="10" fill="#e9d5ff">Zero Copy 전송</text>

  <line x1="845" y1="320" x2="870" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="875" y="295" width="170" height="50" rx="8" fill="#16a34a"/>
  <text x="960" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">병합 영상</text>
  <text x="960" y="333" text-anchor="middle" font-size="10" fill="#bbf7d0">고해상도 출력</text>

  <text x="55" y="367" font-size="11" fill="#92400e">✓ 위치 기반 정밀 트리거 (sub-μs)</text>
  <text x="370" y="367" font-size="11" fill="#92400e">✓ 조명 · 카메라 동기화</text>
  <text x="660" y="367" font-size="11" fill="#92400e">✓ 실시간 이미지 병합</text>
  <text x="55" y="383" font-size="10" fill="#475569" font-style="italic">※ FPGA 동일 클럭 동기화 — Zero Delay, 별도 딜레이 라인 불필요</text>

  <!-- Scenario 3: Low-latency Web Monitoring -->
  <rect x="40" y="400" width="1020" height="145" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="65" cy="425" r="14" fill="#7c3aed"/>
  <text x="65" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">③</text>
  <text x="90" y="430" font-size="14" font-weight="700" fill="#6b21a8">초저지연 웹 기반 모니터링 + AI 실시간 분석</text>

  <rect x="55" y="450" width="155" height="50" rx="8" fill="#dc2626"/>
  <text x="132" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">카메라</text>
  <text x="132" y="488" text-anchor="middle" font-size="10" fill="#fecaca">현장 이미지</text>

  <line x1="215" y1="475" x2="240" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="245" y="450" width="180" height="50" rx="8" fill="#0d9488"/>
  <text x="335" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">FantoVision (엣지)</text>
  <text x="335" y="488" text-anchor="middle" font-size="10" fill="#ccfbf1">현장 AI 처리</text>

  <line x1="430" y1="475" x2="455" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="460" y="450" width="180" height="50" rx="8" fill="#7c3aed"/>
  <text x="550" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">지능형 분석</text>
  <text x="550" y="488" text-anchor="middle" font-size="10" fill="#e9d5ff">실시간 결과</text>

  <line x1="645" y1="475" x2="670" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="675" y="450" width="180" height="50" rx="8" fill="#1e40af"/>
  <text x="765" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">초저지연 전송</text>
  <text x="765" y="488" text-anchor="middle" font-size="10" fill="#bfdbfe">&lt; 100ms 스트리밍</text>

  <line x1="860" y1="475" x2="885" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#solArr)"/>

  <rect x="890" y="450" width="155" height="50" rx="8" fill="#16a34a"/>
  <text x="967" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">웹 대시보드</text>
  <text x="967" y="488" text-anchor="middle" font-size="10" fill="#bbf7d0">통합 모니터링</text>

  <text x="55" y="522" font-size="11" fill="#6b21a8">✓ 현장 밀착형 AI 처리</text>
  <text x="320" y="522" font-size="11" fill="#6b21a8">✓ 초저지연 웹 모니터링</text>
  <text x="595" y="522" font-size="11" fill="#6b21a8">✓ 24시간 무인 자동 감시</text>
  <text x="55" y="538" font-size="10" fill="#475569" font-style="italic">※ 엣지 처리로 별도 서버 불필요 · 네트워크 의존도 최소화</text>

  <!-- Bottom badge -->
  <rect x="40" y="560" width="1020" height="0" rx="0" fill="transparent"/>
</svg>
