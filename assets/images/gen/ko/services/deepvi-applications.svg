<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="540" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">적용 분야</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#475569">동일 파이프라인 — 클래스명·데이터만 바꾸면 즉시 산업 적용</text>

  <!-- Card 1: Manufacturing -->
  <rect x="40" y="100" width="500" height="190" rx="14" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <text x="60" y="135" font-size="32">🏭</text>
  <text x="105" y="130" font-size="17" font-weight="700" fill="#1e3a8a">Manufacturing — 제조 · 품질검사</text>
  <text x="105" y="150" font-size="11" fill="#64748b">육안 검사 피로 / 야간 공백 → 24h 자동 탐지</text>

  <rect x="60" y="170" width="195" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="70" y="190" font-size="11" font-weight="700" fill="#991b1b">❌ 도입 전</text>
  <text x="70" y="210" font-size="11" fill="#7f1d1d">• 작업자 육안 → 피로·오판</text>
  <text x="70" y="228" font-size="11" fill="#7f1d1d">• 숙련 인력 필수</text>
  <text x="70" y="246" font-size="11" fill="#7f1d1d">• 야간·주말 검사 공백</text>
  <text x="70" y="264" font-size="11" fill="#7f1d1d">• 불량 이력 수기 기록</text>

  <rect x="265" y="170" width="265" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="275" y="190" font-size="11" font-weight="700" fill="#15803d">✅ DeepVi 도입 후</text>
  <text x="275" y="210" font-size="11" fill="#166534">• 24h 카메라 실시간 탐지</text>
  <text x="275" y="228" font-size="11" fill="#166534">• 결함 유형별 Detection 자동 분류</text>
  <text x="275" y="246" font-size="11" fill="#166534">• 치수·위치 계측 자동 OK/NG 판정</text>
  <text x="275" y="264" font-size="11" fill="#166534">• 추론 결과 자동 저장 → 데이터 기반 개선</text>

  <!-- Card 2: Smart Farm -->
  <rect x="560" y="100" width="500" height="190" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="135" font-size="32">🌱</text>
  <text x="625" y="130" font-size="17" font-weight="700" fill="#15803d">Smart Farm — 스마트팜</text>
  <text x="625" y="150" font-size="11" fill="#64748b">병해충 발견 후 이미 확산 → 조기 자동 탐지</text>

  <rect x="580" y="170" width="195" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="590" y="190" font-size="11" font-weight="700" fill="#991b1b">❌ 도입 전</text>
  <text x="590" y="210" font-size="11" fill="#7f1d1d">• 병해 발견 시 이미 확산</text>
  <text x="590" y="228" font-size="11" fill="#7f1d1d">• 대면적 모니터링 인력 부족</text>
  <text x="590" y="246" font-size="11" fill="#7f1d1d">• 생장 상태 수기 기록</text>
  <text x="590" y="264" font-size="11" fill="#7f1d1d">• 수확 적기 경험 의존</text>

  <rect x="785" y="170" width="265" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="795" y="190" font-size="11" font-weight="700" fill="#15803d">✅ DeepVi 도입 후</text>
  <text x="795" y="210" font-size="11" fill="#166534">• 카메라 영상 기반 조기 자동 탐지</text>
  <text x="795" y="228" font-size="11" fill="#166534">• 광범위 영역 실시간 모니터링</text>
  <text x="795" y="246" font-size="11" fill="#166534">• 생장 단계별 Segmentation 분석</text>
  <text x="795" y="264" font-size="11" fill="#166534">• 데이터 기반 수확 적기 예측</text>

  <!-- Card 3: Logistics -->
  <rect x="40" y="310" width="500" height="190" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="345" font-size="32">🚚</text>
  <text x="105" y="340" font-size="17" font-weight="700" fill="#92400e">Logistics — 유통 · 물류</text>
  <text x="105" y="360" font-size="11" fill="#64748b">분류·검수 인력 의존 → 컨베이어 자동 처리</text>

  <rect x="60" y="380" width="195" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="70" y="400" font-size="11" font-weight="700" fill="#991b1b">❌ 도입 전</text>
  <text x="70" y="420" font-size="11" fill="#7f1d1d">• 분류·검수 대규모 인력</text>
  <text x="70" y="438" font-size="11" fill="#7f1d1d">• 바코드 손상 시 수작업</text>
  <text x="70" y="456" font-size="11" fill="#7f1d1d">• 재고 실사 정확도 저하</text>
  <text x="70" y="474" font-size="11" fill="#7f1d1d">• 유통기한 수작업 검수</text>

  <rect x="265" y="380" width="265" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="275" y="400" font-size="11" font-weight="700" fill="#15803d">✅ DeepVi 도입 후</text>
  <text x="275" y="420" font-size="11" fill="#166534">• 컨베이어 카메라 실시간 자동 분류</text>
  <text x="275" y="438" font-size="11" fill="#166534">• 라벨·바코드 판독·불량 자동 탐지</text>
  <text x="275" y="456" font-size="11" fill="#166534">• 실시간 재고 비전 모니터링</text>
  <text x="275" y="474" font-size="11" fill="#166534">• 유통기한 이상 자동 감지·기록</text>

  <!-- Card 4: Security -->
  <rect x="560" y="310" width="500" height="190" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="345" font-size="32">🔒</text>
  <text x="625" y="340" font-size="17" font-weight="700" fill="#6b21a8">Security — 보안 · 모니터링</text>
  <text x="625" y="360" font-size="11" fill="#64748b">CCTV 인력 상시 배치 → 무인 24h 자동 분석</text>

  <rect x="580" y="380" width="195" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="590" y="400" font-size="11" font-weight="700" fill="#991b1b">❌ 도입 전</text>
  <text x="590" y="420" font-size="11" fill="#7f1d1d">• CCTV 전담 인력 상시 배치</text>
  <text x="590" y="438" font-size="11" fill="#7f1d1d">• 사건 후 영상 검색 시간 소모</text>
  <text x="590" y="456" font-size="11" fill="#7f1d1d">• 이상 행동 실시간 감지 불가</text>
  <text x="590" y="474" font-size="11" fill="#7f1d1d">• 출입 통제 수작업 확인</text>

  <rect x="785" y="380" width="265" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="795" y="400" font-size="11" font-weight="700" fill="#15803d">✅ DeepVi 도입 후</text>
  <text x="795" y="420" font-size="11" fill="#166534">• 이상 행동·객체 실시간 자동 감지</text>
  <text x="795" y="438" font-size="11" fill="#166534">• 무인 24h CCTV 이벤트 자동 분류</text>
  <text x="795" y="456" font-size="11" fill="#166534">• 출입 객체 자동 분류</text>
  <text x="795" y="474" font-size="11" fill="#166534">• 탐지 좌표·시각 정형 데이터 자동 기록</text>

  <!-- Bottom badge -->
  <rect x="40" y="510" width="1020" height="22" rx="11" fill="#0f172a"/>
  <text x="550" y="526" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">제조 · 의료 · 헬스케어 · 광학 선별 · 임베디드 비전 · 자동 시험 장비(ATE) 등 다양한 산업으로 확장</text>
</svg>
