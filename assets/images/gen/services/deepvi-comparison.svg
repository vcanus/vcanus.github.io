  <text x="722" y="334" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Partial</text>
  <rect x="825" y="318" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ On-Premise capable</text>

  <!-- Row 7: Data Security -->
  <text x="60" y="369" font-size="12" font-weight="600" fill="#0f172a">Data Security</text>
  <text x="522" y="369" text-anchor="middle" font-size="13" fill="#dc2626">❌ External transfer</text>
  <text x="722" y="369" text-anchor="middle" font-size="13" fill="#dc2626">❌ External transfer</text>
  <rect x="825" y="353" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ Internal processing</text>

  <!-- Row 8: Domain Customization -->
  <text x="60" y="404" font-size="12" font-weight="600" fill="#0f172a">Domain Customization</text>
  <text x="522" y="404" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Limited</text>
  <text x="722" y="404" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Limited</text>
  <rect x="825" y="388" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ Per-industry tailored</text>

  <!-- Row 9: Non-Expert Operation -->
  <text x="60" y="439" font-size="12" font-weight="600" fill="#0f172a">Non-Expert Operation</text>
  <text x="522" y="439" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Cloud expertise</text>
  <text x="722" y="439" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Tool-dependent</text>
  <rect x="825" y="423" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ Field operators run</text>

  <!-- Row 10: Pricing Model -->
  <text x="60" y="474" font-size="12" font-weight="600" fill="#0f172a">Pricing Model</text>
  <text x="522" y="474" text-anchor="middle" font-size="13" fill="#dc2626">❌ Pay-as-you-go</text>
  <text x="722" y="474" text-anchor="middle" font-size="13" fill="#dc2626">❌ API pay-per-use</text>
  <rect x="825" y="458" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ Flat-rate license</text>

  <!-- Horizontal divider lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="170" x2="1060" y2="170"/>
    <line x1="40" y1="205" x2="1060" y2="205"/>
    <line x1="40" y1="240" x2="1060" y2="240"/>
    <line x1="40" y1="275" x2="1060" y2="275"/>
    <line x1="40" y1="310" x2="1060" y2="310"/>
    <line x1="40" y1="345" x2="1060" y2="345"/>
    <line x1="40" y1="380" x2="1060" y2="380"/>
    <line x1="40" y1="415" x2="1060" y2="415"/>
    <line x1="40" y1="450" x2="1060" y2="450"/>
  </g>

  <!-- Bottom summary -->
  <rect x="40" y="510" width="1020" height="55" rx="10" fill="#0f172a"/>
  <text x="550" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DeepVi's decisive differentiators — End-to-End No-Code · Real-Time Camera Inference · Auto-Retrain Loop</text>
  <text x="550" y="555" text-anchor="middle" font-size="12" fill="#94a3b8">An AI vision platform field operators run themselves · No external data transfer, fully internal processing</text>
</svg>
