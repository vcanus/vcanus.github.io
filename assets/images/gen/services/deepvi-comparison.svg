<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Competitive Advantages</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#475569">Key differentiators of DeepVi vs. general AutoML and vision specialist tools</text>

  <!-- Header row -->
  <rect x="40" y="90" width="380" height="46" rx="6" fill="#f1f5f9"/>
  <text x="60" y="118" font-size="13" font-weight="700" fill="#0f172a">Comparison</text>

  <rect x="425" y="90" width="195" height="46" rx="6" fill="#f1f5f9"/>
  <text x="522" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">General AutoML</text>
  <text x="522" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Vertex AI · SageMaker</text>

  <rect x="625" y="90" width="195" height="46" rx="6" fill="#f1f5f9"/>
  <text x="722" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Vision Specialist</text>
  <text x="722" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Roboflow · Label Studio</text>

  <rect x="825" y="90" width="235" height="46" rx="6" fill="#1e40af"/>
  <text x="942" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DeepVi ★</text>
  <text x="942" y="128" text-anchor="middle" font-size="10" fill="#bfdbfe">VCANUS</text>

  <!-- Row 1: Coding Required -->
