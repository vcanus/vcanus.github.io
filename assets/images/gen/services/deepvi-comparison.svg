  <text x="60" y="208" font-size="9" fill="#64748b">Cls · Det · Seg</text>
  <text x="522" y="194" text-anchor="middle" font-size="13" fill="#d97706">⚠️ Platform-dep.</text>
  <text x="722" y="194" text-anchor="middle" font-size="13" fill="#16a34a">✅ Strong on labeling</text>
