<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="380" fill="#fef2f2"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">Low-Latency &amp; High Throughput</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#7f1d1d">Ultra-low-latency, high-throughput real-time data processing — &lt; 5ms Latency, 1M msg/sec Throughput</text>

  <g>
    <rect x="40" y="100" width="220" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="135" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">Latency</text>
    <text x="150" y="180" text-anchor="middle" font-size="36" font-weight="700" fill="#dc2626">&lt; 5ms</text>
    <text x="150" y="205" text-anchor="middle" font-size="11" fill="#7f1d1d">guaranteed delivery</text>

    <rect x="280" y="100" width="220" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="390" y="135" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">Throughput</text>
    <text x="390" y="180" text-anchor="middle" font-size="36" font-weight="700" fill="#dc2626">1M msg/s</text>
    <text x="390" y="205" text-anchor="middle" font-size="11" fill="#7f1d1d">per single node</text>

    <rect x="520" y="100" width="220" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="630" y="135" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">Channels</text>
    <text x="630" y="180" text-anchor="middle" font-size="36" font-weight="700" fill="#dc2626">10K × 32ch</text>
    <text x="630" y="205" text-anchor="middle" font-size="11" fill="#7f1d1d">simultaneous real-time</text>
  </g>

  <rect x="760" y="100" width="300" height="120" rx="12" fill="#0f172a"/>
  <text x="910" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">TSLoom vs General Solutions</text>
  <text x="780" y="150" font-size="12" fill="#cbd5e1">TSLoom</text>
  <text x="1040" y="150" font-size="12" fill="#fca5a5" text-anchor="end">1M / &lt; 5ms</text>
  <line x1="780" y1="158" x2="1040" y2="158" stroke="#475569"/>
  <text x="780" y="180" font-size="12" fill="#cbd5e1">General</text>
  <text x="1040" y="180" font-size="12" fill="#fca5a5" text-anchor="end">~400K / &gt; 10ms</text>
  <line x1="780" y1="188" x2="1040" y2="188" stroke="#475569"/>
  <text x="910" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2× Latency Gain   2.5× Throughput Gain</text>

  <g>
    <rect x="40" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="55" y="270" font-size="14" font-weight="700" fill="#991b1b">Processing Performance</text>
    <text x="55" y="293" font-size="11" fill="#7f1d1d">• Patented message routing</text>
    <text x="55" y="312" font-size="11" fill="#7f1d1d">• Inline filter · aggregate · transform</text>
    <text x="55" y="331" font-size="11" fill="#7f1d1d">• Event-based triggers / conditional routing</text>

    <rect x="385" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="400" y="270" font-size="14" font-weight="700" fill="#991b1b">Multi-Stream Integration</text>
    <text x="400" y="293" font-size="11" fill="#7f1d1d">• Sliding/tumbling window analytics</text>
    <text x="400" y="312" font-size="11" fill="#7f1d1d">• Hierarchical multi-source management</text>
    <text x="400" y="331" font-size="11" fill="#7f1d1d">• Auto chunk split &amp; reassemble</text>

    <rect x="730" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="745" y="270" font-size="14" font-weight="700" fill="#991b1b">Time Sync &amp; Data Reliability</text>
    <text x="745" y="293" font-size="11" fill="#7f1d1d">• Multi-stream timeline alignment / TS accuracy</text>
    <text x="745" y="312" font-size="11" fill="#7f1d1d">• Real-time outlier detection / correction</text>
    <text x="745" y="331" font-size="11" fill="#7f1d1d">• Order-preserving · lossless ingestion</text>
  </g>
</svg>
