<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="380" fill="#fef2f2"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">Real-Time Data Processing</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#7f1d1d">Low-latency · high-throughput processing tailored to industrial environments · multi-stream integration · data reliability</text>

  <!-- Three pillar cards -->
  <g>
    <rect x="40" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">Processing Performance</text>
    <text x="205" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">Low Latency · High Throughput</text>
    <text x="205" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">Stable real-time data processing</text>
    <text x="205" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">Concurrent multi-channel processing</text>

    <rect x="385" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="550" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">Multi-Stream Integration</text>
    <text x="550" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">Window · Trigger · Routing</text>
    <text x="550" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">Inline transformation · aggregation</text>
    <text x="550" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">Hierarchical multi-source orchestration</text>

    <rect x="730" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="895" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">Data Reliability</text>
    <text x="895" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">Time Sync · Lossless</text>
    <text x="895" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">Real-time outlier correction</text>
    <text x="895" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">Order-preserving ingestion</text>
  </g>

  <!-- Bottom feature cards -->
  <g>
    <rect x="40" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="55" y="270" font-size="13" font-weight="700" fill="#991b1b">Processing Performance</text>
    <text x="55" y="293" font-size="11" fill="#7f1d1d">• Stable processing tailored to industrial environments</text>
    <text x="55" y="312" font-size="11" fill="#7f1d1d">• Inline filtering · aggregation · transformation</text>
    <text x="55" y="331" font-size="11" fill="#7f1d1d">• Event-based triggers</text>

    <rect x="385" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="400" y="270" font-size="13" font-weight="700" fill="#991b1b">Multi-Stream Processing</text>
    <text x="400" y="293" font-size="11" fill="#7f1d1d">• Sliding · tumbling window analytics</text>
    <text x="400" y="312" font-size="11" fill="#7f1d1d">• Multi-source orchestration</text>
    <text x="400" y="331" font-size="11" fill="#7f1d1d">• Efficient handling of large messages</text>

    <rect x="730" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="745" y="270" font-size="13" font-weight="700" fill="#991b1b">Time Sync · Reliability</text>
    <text x="745" y="293" font-size="11" fill="#7f1d1d">• Multi-stream timeline alignment</text>
    <text x="745" y="312" font-size="11" fill="#7f1d1d">• Real-time outlier detection · correction</text>
    <text x="745" y="331" font-size="11" fill="#7f1d1d">• Order-preserving · lossless ingestion</text>
  </g>
</svg>
