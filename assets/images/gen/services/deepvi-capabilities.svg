<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What You Can Do with DeepVi</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#475569">Removing the four common barriers to AI vision adoption — in one platform</text>

  <rect x="40" y="100" width="500" height="180" rx="14" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
  <circle cx="80" cy="140" r="22" fill="#1e40af"/>
  <text x="80" y="148" text-anchor="middle" font-size="20" fill="#ffffff">①</text>
  <text x="120" y="135" font-size="16" font-weight="700" fill="#1e3a8a">24/7 Real-Time AI Inspection Line</text>
  <text x="120" y="155" font-size="12" fill="#475569">Manual visual inspection → unmanned 24/7 automated line</text>
  <text x="60" y="190" font-size="12" fill="#1e3a8a">✓ No gaps at night or on weekends</text>
  <text x="60" y="212" font-size="12" fill="#1e3a8a">✓ Real-time preprocessing → inference end-to-end</text>
  <text x="60" y="234" font-size="12" fill="#1e3a8a">✓ Defect location · class · confidence on screen</text>
  <text x="60" y="256" font-size="12" fill="#1e3a8a">✓ Auto-saved inspection history with conditional search</text>

  <rect x="560" y="100" width="500" height="180" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="600" cy="140" r="22" fill="#16a34a"/>
  <text x="600" y="148" text-anchor="middle" font-size="20" fill="#ffffff">②</text>
  <text x="640" y="135" font-size="16" font-weight="700" fill="#15803d">No-Code, Run by Field Operators</text>
  <text x="640" y="155" font-size="12" fill="#475569">Specialist teams + outsourcing → field staff run it directly</text>
  <text x="580" y="190" font-size="12" fill="#15803d">✓ Web UI lets non-experts start labeling immediately</text>
  <text x="580" y="212" font-size="12" fill="#15803d">✓ Classification / Detection / Segmentation unified</text>
  <text x="580" y="234" font-size="12" fill="#15803d">✓ One-click training after hyperparameter setup</text>
  <text x="580" y="256" font-size="12" fill="#15803d">✓ Same pipeline applies across industries</text>

  <rect x="40" y="300" width="500" height="180" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="80" cy="340" r="22" fill="#7c3aed"/>
  <text x="80" y="348" text-anchor="middle" font-size="20" fill="#ffffff">③</text>
  <text x="120" y="335" font-size="16" font-weight="700" fill="#6b21a8">Automated MLOps Cycle</text>
  <text x="120" y="355" font-size="12" fill="#475569">Months to retrain → completed within days</text>
  <text x="60" y="390" font-size="12" fill="#6b21a8">✓ End-to-end automation: dataset → deployment</text>
  <text x="60" y="412" font-size="12" fill="#6b21a8">✓ Auto-generation of new models after FP review</text>
  <text x="60" y="434" font-size="12" fill="#6b21a8">✓ Performance comparison and automatic deployment</text>
  <text x="60" y="456" font-size="12" fill="#6b21a8">✓ Sustained accuracy via anomaly detection &amp; recovery</text>

  <rect x="560" y="300" width="500" height="180" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="600" cy="340" r="22" fill="#d97706"/>
  <text x="600" y="348" text-anchor="middle" font-size="20" fill="#ffffff">④</text>
  <text x="640" y="335" font-size="16" font-weight="700" fill="#92400e">On-Premise · Cloud Choice</text>
  <text x="640" y="355" font-size="12" fill="#475569">Cloud lock-in / unpredictable cost → flat-rate license</text>
  <text x="580" y="390" font-size="12" fill="#92400e">✓ Flat-rate license, no usage-based billing</text>
  <text x="580" y="412" font-size="12" fill="#92400e">✓ On-premise — no external data transfer</text>
  <text x="580" y="434" font-size="12" fill="#92400e">✓ Auto-retrain loop — no separate maintenance</text>
  <text x="580" y="456" font-size="12" fill="#92400e">✓ Scale out on-premise just by adding servers</text>

  <rect x="40" y="500" width="1020" height="30" rx="15" fill="#0f172a"/>
  <text x="550" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">No coding required, all in one platform — DeepVi removes every barrier to AI adoption</text>
</svg>
