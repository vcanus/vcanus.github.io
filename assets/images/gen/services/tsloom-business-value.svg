<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">TSLoom — Business Value Overview</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#475569">Supporting digital transformation across Semiconductor · Battery · Smart Factory and beyond</text>

  <!-- column headers -->
  <rect x="40" y="90" width="320" height="40" rx="8" fill="#fee2e2"/>
  <text x="200" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Field Challenges</text>

  <rect x="390" y="90" width="320" height="40" rx="8" fill="#1e3a8a"/>
  <text x="550" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TSLoom Capabilities</text>

  <rect x="740" y="90" width="320" height="40" rx="8" fill="#dcfce7"/>
  <text x="900" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Expected Outcomes</text>

  <!-- Row 1: Data integration -->
  <rect x="40" y="145" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="55" y="170" font-size="13" font-weight="700" fill="#991b1b">Difficult Data Integration</text>
  <text x="55" y="190" font-size="11" fill="#7f1d1d">• Complexity of heterogeneous equipment/systems</text>
  <text x="55" y="208" font-size="11" fill="#7f1d1d">• Time required to onboard new devices</text>

  <rect x="390" y="145" width="320" height="80" rx="8" fill="#eff6ff" stroke="#1e40af"/>
  <text x="405" y="170" font-size="13" font-weight="700" fill="#1e3a8a">Diverse Data Connectivity</text>
  <text x="405" y="190" font-size="11" fill="#1e40af">• Unified integration of equipment and IT systems</text>
  <text x="405" y="208" font-size="11" fill="#1e40af">• Plugin-based extensible ecosystem</text>

  <rect x="740" y="145" width="320" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="755" y="170" font-size="13" font-weight="700" fill="#15803d">Improved On-Site Diagnostics</text>
  <text x="755" y="190" font-size="11" fill="#166534">• Reduced anomaly-detection time</text>
  <text x="755" y="208" font-size="11" fill="#166534">• Lower unplanned downtime</text>

  <!-- Row 2: Analysis -->
  <rect x="40" y="240" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="55" y="265" font-size="13" font-weight="700" fill="#991b1b">Heavy Analytics Setup</text>
  <text x="55" y="285" font-size="11" fill="#7f1d1d">• Barriers to ML model development and deployment</text>
  <text x="55" y="303" font-size="11" fill="#7f1d1d">• Lengthy analytics pipeline construction</text>

  <rect x="390" y="240" width="320" height="80" rx="8" fill="#eff6ff" stroke="#1e40af"/>
  <text x="405" y="265" font-size="13" font-weight="700" fill="#1e3a8a">Visualization · Edge AI · MLOps</text>
  <text x="405" y="285" font-size="11" fill="#1e40af">• Accelerated visualization and dashboards</text>
  <text x="405" y="303" font-size="11" fill="#1e40af">• Edge–central tiered inference + auto operations</text>

  <rect x="740" y="240" width="320" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="755" y="265" font-size="13" font-weight="700" fill="#15803d">Process Prediction · Quality</text>
  <text x="755" y="285" font-size="11" fill="#166534">• Analytics automation including virtual metrology</text>
  <text x="755" y="303" font-size="11" fill="#166534">• Higher process variable accuracy</text>

  <!-- Row 3: Operations -->
  <rect x="40" y="335" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="55" y="360" font-size="13" font-weight="700" fill="#991b1b">Operational Efficiency Limits</text>
  <text x="55" y="380" font-size="11" fill="#7f1d1d">• Manual monitoring delaying response</text>
  <text x="55" y="398" font-size="11" fill="#7f1d1d">• Scaling limits of legacy systems</text>

  <rect x="390" y="335" width="320" height="80" rx="8" fill="#eff6ff" stroke="#1e40af"/>
  <text x="405" y="360" font-size="13" font-weight="700" fill="#1e3a8a">Visual Workflow + Auto Operations</text>
  <text x="405" y="380" font-size="11" fill="#1e40af">• No-code workflow editor</text>
  <text x="405" y="398" font-size="11" fill="#1e40af">• Enterprise security and audit framework</text>

  <rect x="740" y="335" width="320" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="755" y="360" font-size="13" font-weight="700" fill="#15803d">Faster Build · Faster Deployment</text>
  <text x="755" y="380" font-size="11" fill="#166534">• Shorter analytics pipeline build time</text>
  <text x="755" y="398" font-size="11" fill="#166534">• Shorter ML model deployment cycles</text>
</svg>
