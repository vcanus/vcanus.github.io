<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="380" fill="#ecfeff"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0e7490">Visual Workflow &amp; Operational Automation</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#0891b2">No-code workflow design · automated operation on distributed infrastructure</text>

  <!-- Canvas mock -->
  <rect x="40" y="90" width="600" height="270" rx="10" fill="#0f172a"/>
  <text x="55" y="115" font-size="12" font-weight="700" fill="#67e8f9">Workflow Canvas</text>

  <!-- Source -->
  <rect x="70" y="140" width="110" height="50" rx="8" fill="#06b6d4"/>
  <text x="125" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Source</text>
  <text x="125" y="178" text-anchor="middle" font-size="10" fill="#cffafe">data ingest</text>

  <!-- Process -->
  <rect x="220" y="140" width="110" height="50" rx="8" fill="#0891b2"/>
  <text x="275" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Process</text>
  <text x="275" y="178" text-anchor="middle" font-size="10" fill="#cffafe">prep · aggregate</text>

  <!-- ML -->
  <rect x="370" y="140" width="110" height="50" rx="8" fill="#7c3aed"/>
  <text x="425" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ML Inference</text>
  <text x="425" y="178" text-anchor="middle" font-size="10" fill="#e9d5ff">model apply</text>

  <!-- Sink -->
  <rect x="520" y="140" width="100" height="50" rx="8" fill="#10b981"/>
  <text x="570" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Visualize</text>

  <!-- connections -->
  <line x1="180" y1="165" x2="220" y2="165" stroke="#67e8f9" stroke-width="2"/>
  <line x1="330" y1="165" x2="370" y2="165" stroke="#67e8f9" stroke-width="2"/>
  <line x1="480" y1="165" x2="520" y2="165" stroke="#67e8f9" stroke-width="2"/>

  <!-- distributed nodes -->
  <text x="55" y="225" font-size="12" font-weight="700" fill="#67e8f9">Distributed Infrastructure · Auto Operations</text>
  <g>
    <rect x="70" y="240" width="100" height="60" rx="8" fill="#1e293b" stroke="#22c55e"/>
    <text x="120" y="260" text-anchor="middle" font-size="11" fill="#86efac">● Healthy</text>
    <text x="120" y="278" text-anchor="middle" font-size="10" fill="#cbd5e1">low load</text>
    <text x="120" y="295" text-anchor="middle" font-size="10" fill="#86efac">healthy</text>

    <rect x="180" y="240" width="100" height="60" rx="8" fill="#1e293b" stroke="#eab308"/>
    <text x="230" y="260" text-anchor="middle" font-size="11" fill="#fde68a">● Healthy</text>
    <text x="230" y="278" text-anchor="middle" font-size="10" fill="#cbd5e1">mid load</text>
    <text x="230" y="295" text-anchor="middle" font-size="10" fill="#fde68a">healthy</text>

    <rect x="290" y="240" width="100" height="60" rx="8" fill="#1e293b" stroke="#ef4444"/>
    <text x="340" y="260" text-anchor="middle" font-size="11" fill="#fca5a5">✕ Failed</text>
    <text x="340" y="278" text-anchor="middle" font-size="10" fill="#cbd5e1">auto isolated</text>
    <text x="340" y="295" text-anchor="middle" font-size="10" fill="#fca5a5">↺ Failover</text>

    <rect x="400" y="240" width="100" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-dasharray="4,4"/>
    <text x="450" y="260" text-anchor="middle" font-size="11" fill="#67e8f9">+ New Node</text>
    <text x="450" y="278" text-anchor="middle" font-size="10" fill="#cbd5e1">dynamic add</text>
    <text x="450" y="295" text-anchor="middle" font-size="10" fill="#67e8f9">scaling-out</text>

    <rect x="510" y="240" width="110" height="60" rx="8" fill="#1e293b" stroke="#0d9488" stroke-dasharray="4,4"/>
    <text x="565" y="260" text-anchor="middle" font-size="11" fill="#5eead4">+ Auto Scale</text>
    <text x="565" y="278" text-anchor="middle" font-size="10" fill="#cbd5e1">high-load resp.</text>
    <text x="565" y="295" text-anchor="middle" font-size="10" fill="#5eead4">on demand</text>
  </g>

  <text x="55" y="335" font-size="11" fill="#cbd5e1">Auto failure response · zero-downtime deploy · operational history</text>

  <!-- features panel -->
  <rect x="660" y="90" width="400" height="270" rx="10" fill="#ffffff" stroke="#0891b2"/>
  <text x="675" y="115" font-size="14" font-weight="700" fill="#0e7490">Workflow Design</text>
  <text x="675" y="135" font-size="11" fill="#155e75">• Drag-and-drop editor</text>
  <text x="675" y="153" font-size="11" fill="#155e75">• Single canvas: ingest → process → infer → visualize</text>
  <text x="675" y="171" font-size="11" fill="#155e75">• No-code env. accessible to non-developers</text>
  <text x="675" y="189" font-size="11" fill="#155e75">• Reusable workflow templates</text>
  <text x="675" y="207" font-size="11" fill="#155e75">• Version control · one-click deployment</text>

  <text x="675" y="235" font-size="14" font-weight="700" fill="#0e7490">High-Availability Distributed Infra</text>
  <text x="675" y="255" font-size="11" fill="#155e75">• Dynamic node placement aligned with environment</text>
  <text x="675" y="273" font-size="11" fill="#155e75">• Load-based auto scaling</text>
  <text x="675" y="291" font-size="11" fill="#155e75">• Hot-swap node operations</text>
  <text x="675" y="309" font-size="11" fill="#155e75">• Auto failover</text>
  <text x="675" y="327" font-size="11" fill="#155e75">• Zero-downtime rolling deployment</text>
  <text x="675" y="345" font-size="11" fill="#155e75">• Real-time workflow status monitoring</text>
</svg>
