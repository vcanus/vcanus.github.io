<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="440" fill="#faf5ff"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#6b21a8">Edge · AI · MLOps Integration</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#7e22ce">Edge–central tiered inference · Automated model development, operations, and retraining</text>

  <!-- Left container -->
  <rect x="40" y="90" width="700" height="335" rx="10" fill="#ffffff" stroke="#a855f7"/>
  <text x="55" y="115" font-size="13" font-weight="700" fill="#6b21a8">Edge–Central Tiered Inference</text>

  <!-- Edge node -->
  <rect x="60" y="135" width="180" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Edge</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#5b21b6">Fast 1st-pass diagnosis</text>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#5b21b6">Lightweight models</text>
  <text x="150" y="225" text-anchor="middle" font-size="11" fill="#5b21b6">On-site inference</text>

  <!-- arrow -->
  <line x1="245" y1="185" x2="295" y2="185" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="178" text-anchor="middle" font-size="10" fill="#7c3aed">routing</text>

  <!-- Server -->
  <rect x="300" y="135" width="180" height="100" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="390" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Central (On-Prem · Cloud)</text>
  <text x="390" y="185" text-anchor="middle" font-size="11" fill="#e9d5ff">Deep · high-accuracy</text>
  <text x="390" y="205" text-anchor="middle" font-size="11" fill="#e9d5ff">Centralized inference</text>
  <text x="390" y="225" text-anchor="middle" font-size="11" fill="#e9d5ff">Composite models</text>

  <!-- Multimodal pills -->
  <text x="55" y="265" font-size="13" font-weight="700" fill="#6b21a8">Multimodal Inputs</text>
  <g font-size="11" font-weight="600">
    <rect x="60" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="100" y="298" text-anchor="middle" fill="#ffffff">Raw</text>
    <rect x="150" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="190" y="298" text-anchor="middle" fill="#ffffff">Text</text>
    <rect x="240" y="280" width="100" height="28" rx="14" fill="#a855f7"/><text x="290" y="298" text-anchor="middle" fill="#ffffff">DataFrame</text>
    <rect x="350" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="390" y="298" text-anchor="middle" fill="#ffffff">Image</text>
  </g>

  <!-- Node types — 4-col grid, row1: 4 items, row2: 3 items -->
  <text x="55" y="335" font-size="13" font-weight="700" fill="#6b21a8">Available Node Types</text>
  <g font-size="11" font-weight="600">
    <!-- Row 1 -->
    <rect x="60"  y="350" width="155" height="28" rx="14" fill="#0f766e"/><text x="137"  y="368" text-anchor="middle" fill="#ffffff">Data IO</text>
    <rect x="225" y="350" width="155" height="28" rx="14" fill="#0f766e"/><text x="302"  y="368" text-anchor="middle" fill="#ffffff">Transform</text>
    <rect x="390" y="350" width="155" height="28" rx="14" fill="#0f766e"/><text x="467"  y="368" text-anchor="middle" fill="#ffffff">Feature Extraction</text>
    <rect x="555" y="350" width="155" height="28" rx="14" fill="#0f766e"/><text x="632"  y="368" text-anchor="middle" fill="#ffffff">Analytics</text>
    <!-- Row 2 -->
    <rect x="60"  y="388" width="155" height="28" rx="14" fill="#0f766e"/><text x="137"  y="406" text-anchor="middle" fill="#ffffff">AI Service</text>
    <rect x="225" y="388" width="155" height="28" rx="14" fill="#0f766e"/><text x="302"  y="406" text-anchor="middle" fill="#ffffff">Flow Control</text>
    <rect x="390" y="388" width="155" height="28" rx="14" fill="#0f766e"/><text x="467"  y="406" text-anchor="middle" fill="#ffffff">Trigger</text>
  </g>

  <!-- Right MLOps panel (matched height) -->
  <rect x="760" y="90" width="300" height="335" rx="10" fill="#0f172a"/>
  <text x="910" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Auto-MLOps Pipeline</text>

  <!-- 4-step pipeline — equal padding (30) + equal spacing (80) -->
  <g font-weight="600">
    <circle cx="790" cy="160" r="20" fill="#a855f7"/><text x="790" y="166" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
    <text x="790" y="200" text-anchor="middle" font-size="11" fill="#cbd5e1">Train</text>

    <line x1="810" y1="160" x2="850" y2="160" stroke="#cbd5e1" stroke-width="2"/>

    <circle cx="870" cy="160" r="20" fill="#a855f7"/><text x="870" y="166" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
    <text x="870" y="200" text-anchor="middle" font-size="11" fill="#cbd5e1">Register</text>

    <line x1="890" y1="160" x2="930" y2="160" stroke="#cbd5e1" stroke-width="2"/>

    <circle cx="950" cy="160" r="20" fill="#a855f7"/><text x="950" y="166" text-anchor="middle" font-size="13" fill="#ffffff">3</text>
    <text x="950" y="200" text-anchor="middle" font-size="11" fill="#cbd5e1">Deploy</text>

    <line x1="970" y1="160" x2="1010" y2="160" stroke="#cbd5e1" stroke-width="2"/>

    <circle cx="1030" cy="160" r="20" fill="#a855f7"/><text x="1030" y="166" text-anchor="middle" font-size="13" fill="#ffffff">4</text>
    <text x="1030" y="200" text-anchor="middle" font-size="11" fill="#cbd5e1">Monitor</text>
  </g>

  <text x="775" y="245" font-size="12" font-weight="700" fill="#fde68a">Automated Areas</text>
  <text x="775" y="270" font-size="11" fill="#cbd5e1">• Model Registry · version control</text>
  <text x="775" y="290" font-size="11" fill="#cbd5e1">• Automated model performance monitoring</text>
  <text x="775" y="310" font-size="11" fill="#cbd5e1">• Gradual rollout and rollback support</text>
  <text x="775" y="330" font-size="11" fill="#cbd5e1">• Experiment tracking and version control</text>
  <text x="775" y="355" font-size="11" fill="#cbd5e1">• Algorithm support across multiple languages</text>
  <text x="775" y="375" font-size="11" fill="#cbd5e1">• Custom algorithm integration</text>
  <text x="775" y="395" font-size="11" fill="#cbd5e1">• Edge–Central unified model deployment</text>
</svg>
