<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="360" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Diverse Data Connectivity</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#475569">Unified integration of heterogeneous equipment and IT systems · Plugin-based extensibility</text>

  <!-- Left: Source categories -->
  <g font-size="11" font-weight="600">
    <rect x="40" y="100" width="210" height="34" rx="17" fill="#1e40af"/>
    <text x="145" y="122" text-anchor="middle" fill="#ffffff">Industrial Fieldbus</text>
    <rect x="40" y="143" width="210" height="34" rx="17" fill="#1e40af"/>
    <text x="145" y="165" text-anchor="middle" fill="#ffffff">Message-Based Communication</text>

    <rect x="40" y="195" width="210" height="34" rx="17" fill="#7c3aed"/>
    <text x="145" y="217" text-anchor="middle" fill="#ffffff">CNC Controllers</text>
    <rect x="40" y="238" width="210" height="34" rx="17" fill="#0891b2"/>
    <text x="145" y="260" text-anchor="middle" fill="#ffffff">DAQ Devices</text>
  </g>

  <!-- arrow to plugin -->
  <text x="305" y="180" font-size="14" fill="#475569">Source</text>
  <line x1="290" y1="200" x2="350" y2="200" stroke="#1e40af" stroke-width="2"/>

  <!-- Plugin -->
  <rect x="375" y="160" width="170" height="80" rx="10" fill="#f59e0b"/>
  <text x="460" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Plugin Layer</text>
  <text x="460" y="218" text-anchor="middle" font-size="11" fill="#ffffff">Hot-add new connectors</text>

  <!-- arrow to TSLoom -->
  <line x1="555" y1="200" x2="615" y2="200" stroke="#f59e0b" stroke-width="2"/>

  <!-- TSLoom core -->
  <rect x="630" y="130" width="190" height="140" rx="12" fill="#0f172a"/>
  <text x="725" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">TSLoom</text>
  <text x="725" y="208" text-anchor="middle" font-size="12" fill="#cbd5e1">Workflow Engine</text>
  <text x="725" y="228" text-anchor="middle" font-size="12" fill="#cbd5e1">Distributed</text>

  <!-- arrow to sinks -->
  <line x1="825" y1="200" x2="880" y2="200" stroke="#0d9488" stroke-width="2"/>

  <!-- Right: Sink categories -->
  <g font-size="11" font-weight="600">
    <rect x="895" y="100" width="165" height="34" rx="17" fill="#0d9488"/>
    <text x="977" y="122" text-anchor="middle" fill="#ffffff">Relational · NoSQL · TSDB</text>
    <rect x="895" y="143" width="165" height="34" rx="17" fill="#16a34a"/>
    <text x="977" y="165" text-anchor="middle" fill="#ffffff">Cloud Environments</text>
    <rect x="895" y="195" width="165" height="34" rx="17" fill="#475569"/>
    <text x="977" y="217" text-anchor="middle" fill="#ffffff">Enterprise Systems</text>
    <rect x="895" y="238" width="165" height="34" rx="17" fill="#dc2626"/>
    <text x="977" y="260" text-anchor="middle" fill="#ffffff">Standard API · Custom Plugin</text>
  </g>

  <!-- bottom badge -->
  <rect x="40" y="320" width="1020" height="28" rx="14" fill="#1e3a8a"/>
  <text x="550" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Diverse Protocols  ·  Multi-Infra Support  ·  Plugin-Based Extensible Ecosystem</text>
</svg>
