<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hmap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="0.8" stop-color="#eab308"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- divider -->
  <line x1="500" y1="40" x2="500" y2="390" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel A : 2D profile (single laser line) ===== -->
  <text x="60" y="46" font-size="22" font-weight="700" fill="#0f172a">2D Profile — laser line</text>
  <text x="60" y="70" font-size="14" fill="#64748b">A laser line captures the surface height (Z) profile</text>

  <!-- sensor head -->
  <rect x="200" y="92" width="120" height="46" rx="6" fill="#1f2937"/>
  <circle cx="240" cy="135" r="5" fill="#2f81f7"/>
  <circle cx="280" cy="135" r="5" fill="#2f81f7"/>
  <text x="260" y="120" font-size="12" fill="#e5e7eb" text-anchor="middle">Profile sensor</text>

  <!-- laser fan -->
  <polygon points="260,138 150,300 370,300" fill="#2f81f7" opacity="0.12"/>
  <line x1="260" y1="138" x2="150" y2="300" stroke="#2f81f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="138" x2="370" y2="300" stroke="#2f81f7" stroke-width="1.5" opacity="0.5"/>

  <!-- part cross section with a step + dent -->
  <path d="M110,360 L110,320 L210,320 L210,288 L300,288 L300,310 L330,310 L345,330 L360,310 L410,310 L410,360 Z"
        fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <!-- laser line tracing the surface -->
  <path d="M150,335 L210,320 L210,288 L300,288 L300,310 L330,310 L345,330 L360,310 L370,311"
        fill="none" stroke="#2f81f7" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Z axis arrow -->
  <line x1="92" y1="360" x2="92" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrz)"/>
  <text x="84" y="278" font-size="12" fill="#475569" text-anchor="end">Z</text>

  <!-- ===== Panel B : 3D scan (area) ===== -->
  <text x="560" y="46" font-size="22" font-weight="700" fill="#0f172a">3D Scan — height map</text>
  <text x="560" y="70" font-size="14" fill="#64748b">Scanning the line across builds a full 3D height map</text>

  <!-- sensor head moving -->
  <rect x="600" y="92" width="120" height="46" rx="6" fill="#1f2937"/>
  <text x="660" y="120" font-size="12" fill="#e5e7eb" text-anchor="middle">Profile sensor</text>
  <line x1="730" y1="115" x2="880" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="805" y="106" font-size="12" fill="#475569" text-anchor="middle">scan direction</text>

  <!-- 3D height map surface (isometric grid) -->
  <g stroke="#ffffff" stroke-width="1">
    <polygon points="600,300 780,260 900,310 720,350" fill="url(#hmap)" opacity="0.85"/>
  </g>
  <!-- grid lines on surface -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.7" fill="none">
    <line x1="645" y1="290" x2="765" y2="332"/>
    <line x1="690" y1="280" x2="810" y2="322"/>
    <line x1="735" y1="270" x2="855" y2="312"/>
    <line x1="660" y1="285" x2="780" y2="262"/>
    <line x1="690" y1="320" x2="810" y2="297"/>
  </g>
  <!-- raised bump on the map (height) -->
  <path d="M740,300 q20,-30 45,-12 q-10,28 -40,18 z" fill="#dc2626" opacity="0.55" stroke="#ffffff"/>
  <text x="750" y="372" font-size="12" fill="#64748b" text-anchor="middle">3D height map (X·Y·Z)</text>

  <!-- color scale -->
  <rect x="930" y="250" width="14" height="90" rx="3" fill="url(#hmap)" transform="rotate(180 937 295)"/>
  <text x="952" y="256" font-size="10" fill="#64748b">high</text>
  <text x="952" y="344" font-size="10" fill="#64748b">low</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrz" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
</svg>
